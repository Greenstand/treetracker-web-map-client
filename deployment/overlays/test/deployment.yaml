apiVersion: apps/v1
kind: Deployment
metadata:
  name: treetracker-web-map-client-deploy
  namespace: webmap
  labels:
    app: treetracker-web-map-client-main
spec:
  template:
    metadata:
      labels:
        app: treetracker-web-map-client-main
    spec:
      containers:
        - name: treetracker-web-map-client-main
          env:
            - name: NODE_ENV
              value: test
            - name: NEXT_PUBLIC_API
              value: https://test-k8s.treetracker.org/query
            - name: NEXT_PUBLIC_TILE_SERVER_URL
              value: https://{s}.treetracker.org/tiles/
            - name: NEXT_PUBLIC_TILE_SERVER_SUBDOMAINS
              value: test-k8s
            - name: NEXT_PUBLIC_TILE_SERVER_WEBMAP_API
              value: https://test-k8s.treetracker.org/webmap/
