# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: API CI for New Pull Requests

# No path filter: each PR gets all checks, also a PR that changes only
# documents. A branch rule can require the job "CI passed", and a PR without
# a run would wait for that check without an end.
on:
  pull_request:
    branches:
      - '*'

# read-only token: the PR checks only read the repository
permissions:
  contents: read

jobs:
  # static checks run in their own job, so a test failure cannot hide them
  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Checkout 🛎️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # no node-version: use the runner's Node.js, as the Cypress jobs do
      # https://github.com/actions/setup-node
      - name: Set up npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      # setup-node adds problem matchers for ESLint and tsc. They would show
      # existing findings as annotations on each PR. The ESLint step and the
      # type check step add their own annotations for the new findings only,
      # so remove the matchers.
      - name: Remove problem matchers
        run: |
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"
          echo "::remove-matcher owner=tsc::"

      - name: Install 📦
        id: install
        run: npm ci
        env:
          # the static checks do not need the Cypress binary
          CYPRESS_INSTALL_BINARY: 0

      # fails on each ESLint finding that is not in eslint-suppressions.json
      # (also on a line that the PR did not change), and on each fixed finding
      # that is still in the file. The log says how to fix each failure.
      - name: ESLint
        run: npm run baseline -- eslint

      # fails on each type error that is not in tsc-suppressions.json (also
      # in a file that the PR did not change, for example a caller of a
      # changed function), and on each fixed type error that is still in the
      # file. It also runs when the ESLint step fails, so that the PR shows
      # the results of both checks.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run baseline -- tsc

  # fails when the PR adds a dependency with a known high or critical
  # vulnerability. Vulnerabilities that are already on the base branch do
  # not count.
  dependency-review:
    name: Run dependency review
    runs-on: ubuntu-latest

    steps:
      # no checkout: the action gets the dependency changes of the PR from
      # the GitHub dependency graph
      # https://github.com/actions/dependency-review-action
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # a vulnerable dev dependency does not fail the check
          fail-on-scopes: runtime
          # no license policy. With the check on, a license that is not a
          # valid SPDX id fails the check.
          license-check: false
          # the Scorecard data comes from outside services and only adds
          # warnings
          show-openssf-scorecard: false

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    # A fixed Chrome version. Cypress 12.14.0 stops when the second spec opens
    # in Chrome 158 or later (Cypress issue 35195, fixed in Cypress 15.21.2),
    # and Cypress 14 or later cannot run the component tests of Next.js 12.
    # The tag names the Node.js and Chrome versions, the digest fixes the
    # image. Remove the container when Cypress is upgraded.
    # https://hub.docker.com/r/cypress/browsers
    container:
      image: cypress/browsers:node-24.22.1-chrome-156.0.8078.73-1-ff-159.0-edge-156.0.4314.50-1@sha256:348cf0242c31155e85b2a90fdd5f95afc1f3aaeca830ba98acadb3ce5d77c4e0
      # the README of cypress-io/github-action asks for this user, to avoid
      # permission problems with the checkout
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Install cached NPM dependencies, run integration tests
      # https://github.com/cypress-io/github-action
      - name: Cypress Integration Tests 🧪
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          # use mock api
          env: nock=true
          spec: cypress/tests/integration/**/*.cy.js
          browser: chrome

      - name: Save screenshots
        # step runs even if other steps fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          # no warning when the run stops before the tests. The job log shows why.
          if-no-files-found: ignore
      - name: Save videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-videos
          path: cypress/videos
          # cypress/plugins/index.js keeps only the videos of failed specs
          if-no-files-found: ignore

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Component tests 🧪
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          command: npm run cypress:run:component

      - name: Jest Unit Tests 🧪
        # run Jest also when a component test fails
        if: ${{ !cancelled() }}
        run: npx jest --ci

      - name: Save screenshots
        # step runs even if other steps fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-screenshots-ct
          path: cypress/screenshots
          # the component tests take a screenshot only when a test fails
          if-no-files-found: ignore

      - name: Save videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-videos-ct
          path: cypress/videos

  # The one check that a branch rule can require. A rule finds a check by its
  # job name, so no other job in this repository can have this name.
  # It fails when a job before it failed, was cancelled or did not run.
  # Without it, a rule would need the name of each job, and GitHub counts a
  # skipped job as passed.
  ci-passed:
    name: CI passed
    needs: [static-checks, dependency-review, integration-tests, unit-tests]
    # always(): run also after a failed or cancelled job. GitHub would skip
    # this job without it, and a skipped job counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the result of each job
        env:
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          INTEGRATION_TESTS: ${{ needs.integration-tests.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
        run: |
          failed=0
          check() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then failed=1; fi
          }
          check "Run static checks" "${STATIC_CHECKS}"
          check "Run dependency review" "${DEPENDENCY_REVIEW}"
          check "Run integration tests" "${INTEGRATION_TESTS}"
          check "Run unit tests" "${UNIT_TESTS}"
          if [ "${failed}" -ne 0 ]; then
            echo "::error::A job did not pass. Open the job with the red mark to see the cause."
            exit 1
          fi
